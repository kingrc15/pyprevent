[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprevent"
version = "0.1.0"
description = "Python implementation of the AHA PREVENT 10-year cardiovascular risk equations."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ryan King" }]
keywords = [
    "PREVENT",
    "AHA",
    "cardiovascular",
    "ASCVD",
    "heart-failure",
    "risk-prediction",
    "epidemiology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/kingrc15/pyprevent"
Repository = "https://github.com/kingrc15/pyprevent"
Issues = "https://github.com/kingrc15/pyprevent/issues"

[tool.setuptools]
py-modules = ["prevent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
